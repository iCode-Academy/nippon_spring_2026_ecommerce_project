<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Shop')}"></head>

<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="hero hero-compact">
        <div class="hero-copy">
            <p class="eyebrow">Your favorite online store</p>
            <h1>Shop smarter.<br>Live better.</h1>
            <p class="lead">From everyday essentials to your next favorite find, we've got you covered.</p>
            <div class="hero-actions">
                <a class="btn btn-secondary" th:href="@{/products}">Browse all products</a>
            </div>
        </div>
        <div class="hero-art" aria-hidden="true">
            <img th:src="@{/images/hero.png}" alt="">
        </div>
    </section>

    <div th:if="${#lists.isEmpty(products)}" class="empty-state card">
        <h2>No products yet</h2>
        <p>New arrivals are on the way. Please check back soon.</p>
    </div>

    <section th:unless="${#lists.isEmpty(products)}" class="card-grid"
             aria-label="Products">
        <th:block th:each="product : ${products}">
            <div th:replace="~{fragments/product-card :: productCard (product=${product})}"></div>
        </th:block>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
