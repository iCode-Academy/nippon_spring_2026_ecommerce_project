<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Categories')}"></head>

<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <noscript>
        <div class="flash flash-error" role="alert">
            JavaScript is disabled. Enable it to manage categories.
        </div>
    </noscript>

    <div class="page-heading">
        <h1>Categories</h1>
        <button type="button" id="newCategoryBtn" class="btn btn-primary">New category</button>
    </div>

    <section id="formSection" class="card hidden" aria-live="polite">
        <h2 id="formTitle">New Category</h2>
        <form id="categoryForm" autocomplete="off">
            <input type="hidden" id="editId" name="editId">
            <div class="field">
                <label for="fName">Name</label>
                <input type="text" id="fName" name="name" maxlength="150"
                       placeholder="e.g. Stationery" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-ghost" onclick="hideForm()">Cancel</button>
            </div>
        </form>
    </section>

    <div id="emptyTable" class="empty-state card hidden">
        <h2>No categories yet</h2>
        <p>Create the first category to organize products in the shop.</p>
    </div>

    <div class="table-wrap">
        <table>
            <caption class="visually-hidden">Product categories</caption>
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody id="categoriesTableBody">
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/admin-categories.js}" defer></script>
</body>

</html>
