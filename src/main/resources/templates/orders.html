<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('My orders')}"></head>

<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main id="main" class="container account-shell">
    <aside th:replace="~{fragments/account :: accountNav}"></aside>
    <div class="account-main">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="account-page-header">
        <p class="eyebrow">Your account</p>
        <h1>My orders</h1>
        <p class="muted">Review your order history and track each order.</p>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state card">
        <h2>No orders yet</h2>
        <p>When you place an order it will show up here.</p>
        <a class="btn btn-primary" th:href="@{/home}">Start shopping</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="table-wrap">
        <table>
            <caption class="visually-hidden">Orders for the signed in customer</caption>
            <thead>
                <tr>
                    <th scope="col">Order</th>
                    <th scope="col">Date</th>
                    <th scope="col">Status</th>
                    <th scope="col">Items</th>
                    <th scope="col">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td>
                        <a th:href="@{/orders/{id}(id=${order.id})}" th:text="'#' + ${order.id}">#1</a>
                    </td>
                    <td th:text="${order.createdAt}">2026-01-01</td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status.toString() == 'CANCELLED'} ? 'badge-warn' : 'badge-ok'"
                              th:text="${order.status}">PENDING</span>
                    </td>
                    <td th:text="${#lists.size(order.items)}">0</td>
                    <td th:text="'$' + ${order.total}">$0.00</td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${page != null and page.totalPages > 1}" class="pagination" aria-label="Order history pages">
            <a th:if="${page.hasPrevious()}"
               class="btn btn-ghost"
               th:href="@{/orders(page=${page.number - 1}, size=${page.size})}">Previous</a>
            <span th:text="'Page ' + (${page.number + 1}) + ' of ' + ${page.totalPages}">Page 1 of 1</span>
            <a th:if="${page.hasNext()}"
               class="btn btn-ghost"
               th:href="@{/orders(page=${page.number + 1}, size=${page.size})}">Next</a>
        </nav>
    </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
