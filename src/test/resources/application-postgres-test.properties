
# Separate PostgreSQL database for integration tests
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use Flyway migrations to create the database schema
spring.flyway.enabled=true

# Update schema automatically instead of validating
spring.jpa.hibernate.ddl-auto=update

# Database credentials for test profile (override defaults)
spring.datasource.username=postgres
spring.datasource.password=postgres

# Reduce test output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
