<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: addresses('My Addresses')}"></head>

<body>
<h1>My Delivery Addresses</h1>

<div th:replace="~{fragments/layout :: nav}"></div>

<main id="main" class="container narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Default Address Summary -->
    <div class="card" th:if="${defaultAddress != null}">
        <h3>Default Address</h3>
        <p>
            <strong th:text="${defaultAddress.title}">Home</strong>
            <span th:text="${defaultAddress.city}">, City</span>
        </p>
    </div>

    <!-- Address List -->
    <div th:if="${#lists.isEmpty(addresses)}" class="empty-state card">
        <h2>No addresses yet</h2>
        <p>Add your first delivery address to proceed with orders.</p>
        <a th:href="@{/addresses/create}" class="btn btn-primary">Add Address</a>
    </div>

    <table th:unless="${#lists.isEmpty(addresses)}" class="table">
        <caption class="visually-hidden">Customer addresses</caption>
        <thead>
            <tr>
                <th scope="col">Default</th>
                <th scope="col">Title</th>
                <th scope="col">Address</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="address : ${addresses}">
                <td>
                    <span th:if="${address.defaultAddress}" class="badge badge-ok">Default</span>
                    <span th:unless="${address.defaultAddress}">&nbsp;</span>
                </td>
                <td th:text="${address.title}">Home</td>
                <td th:text="${address.city}">City</td>
                <td>
                    <a th:href="@{/addresses/edit/{id}(id=${address.id})}" class="btn btn-sm btn-outline">Edit</a>
                    <button th:onclick="deleteAddress(${address.id})"
                            class="btn btn-sm btn-danger">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Create Address Form -->
    <div class="card" th:if="${#lists.isEmpty(addresses)}">
        <h3>Add New Address</h3>
        <form th:action@{/@{/addresses/create}}" method="post" class="form-card" novalidate>
            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required/>
            </div>
            <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required/>
            </div>
            <div class="field">
                <label for="district">District</label>
                <input type="text" id="district" name="district"/>
            </div>
            <div class="field">
                <label for="addressLine">Address Line</label>
                <input type="text" id="addressLine" name="addressLine" required/>
            </div>
            <div class="field">
                <label for="phone">Phone <span class="optional">(optional)</span></label>
                <input type="tel" id="phone" name="phone"/>
            </div>
            <div class="field">
                <label>
                    <input type="checkbox" name="defaultAddress"/> Set as default address
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Add Address</button>
        </form>
    </div>

    <hr/>

    <a th:href="@{/profile}" class="btn btn-link">Back to Profile</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
//<![CDATA[
    function deleteAddress(id) {
        if (confirm('Are you sure you want to delete this address?')) {
            // Perform delete via AJAX or form submission
            window.location.href = '/api/addresses/' + id;
        }
    }
//]]>
</script>
