
# Separate PostgreSQL database for integration tests
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_test
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use Flyway migrations to create the database schema
spring.flyway.enabled=true

# Validate schema instead of modifying it automatically
spring.jpa.hibernate.ddl-auto=validate

# Reduce test output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
