<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Order details')}"></head>

<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main id="main" class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div th:if="${detail != null}" class="card">
        <p><a th:href="@{/orders}">&larr; Back to My orders</a></p>
        <h1 th:text="'Order #' + ${detail.id}">Order #1</h1>

        <div class="order-metadata">
            <div class="metadata-row">
                <span class="metadata-label">Date:</span>
                <span th:text="${detail.createdAt}">2026-01-01</span>
            </div>
            <div class="metadata-row">
                <span class="metadata-label">Status:</span>
                <span class="badge"
                      th:classappend="${detail.status == 'CANCELLED'} ? 'badge-warn' : 'badge-ok'"
                      th:text="${detail.status}">PENDING</span>
            </div>
            <div class="metadata-row">
                <span class="metadata-label">Items:</span>
                <span th:text="${detail.itemCount}">0</span>
            </div>
            <div class="metadata-row">
                <span class="metadata-label">Subtotal:</span>
                <span th:text="'$' + ${detail.subtotal}">$0.00</span>
            </div>
            <div class="metadata-row">
                <span class="metadata-label">Total:</span>
                <span th:text="'$' + ${detail.total}">$0.00</span>
            </div>
        </div>

        <div class="delivery-details">
            <h2>Delivery details</h2>
            <dl>
                <dt>Label:</dt>
                <dd th:text="${#strings.isEmpty(detail.shipTitle) ? 'Not specified' : detail.shipTitle}">Home</dd>
                <dt>Address:</dt>
                <dd th:text="${detail.shipCity} + ', ' + ${detail.shipDistrict} + ', ' + ${detail.shipAddressLine}">
                    City, District, Street
                </dd>
                <dt>Phone:</dt>
                <dd th:text="${#strings.isEmpty(detail.shipPhone) ? 'Not provided' : detail.shipPhone}">99112233</dd>
            </dl>
        </div>

        <div class="order-items">
            <h2 th:text="'Items (' + ${detail.itemCount} + ')'">Items (0)</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Product</th>
                            <th scope="col">Unit price</th>
                            <th scope="col">Qty</th>
                            <th scope="col">Line total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${detail.items}">
                            <td th:text="${item.productName}">Product</td>
                            <td th:text="'$' + ${item.unitPrice}">$0.00</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="'$' + ${item.lineTotal}">$0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <hr/>
            <p><strong>Order total:</strong> <span th:text="'$' + ${detail.total}">$0.00</span></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
