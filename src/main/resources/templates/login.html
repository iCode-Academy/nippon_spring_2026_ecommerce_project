<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Sign in')}"></head>

<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main id="main" class="container narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <h1>Sign in</h1>

    <div th:if="${param.error}" class="flash flash-error" role="alert">
        Invalid email or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="flash flash-success" role="status">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post" class="card form-card" novalidate>
        <div class="field">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" autocomplete="email"
                   required aria-required="true">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required aria-required="true">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="form-footer">
        No account yet?
        <a th:href="@{/register}">Create one</a>.
    </p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
