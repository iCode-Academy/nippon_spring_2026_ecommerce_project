<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Addresses')}"></head>

<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main id="main" class="container narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>My Delivery Addresses</h1>

    <!-- Default Address Summary -->
    <div class="card" th:if="${defaultAddress != null}">
        <h3>Default Address</h3>
        <p>
            <strong th:text="${defaultAddress.title}">Home</strong>
            <span th:text="${defaultAddress.city}">, City</span>
        </p>
    </div>

    <!-- Address List -->
    <div th:if="${#lists.isEmpty(addresses)}" class="empty-state card">
        <h2>No addresses yet</h2>
        <p>Add your first delivery address to proceed with orders.</p>
    </div>

    <div th:unless="${#lists.isEmpty(addresses)}" class="table-wrap"><table class="table">
        <caption class="visually-hidden">Customer addresses</caption>
        <thead>
            <tr>
                <th scope="col">Default</th>
                <th scope="col">Title</th>
                <th scope="col">Address</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="address : ${addresses}">
                <td>
                    <span th:if="${address.defaultAddress}" class="badge badge-ok">Default</span>
                    <span th:unless="${address.defaultAddress}">&nbsp;</span>
                </td>
                <td th:text="${address.title}">Home</td>
                <td th:text="${address.city}">City</td>
                <td>
                    <a th:href="@{/addresses/edit/{id}(id=${address.id})}" class="btn btn-sm btn-outline">Edit</a>
                    <form th:action="@{/addresses/delete/{id}(id=${address.id})}" method="post" class="inline-form">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table></div>

    <!-- Create Address Form -->
    <div class="card">
        <h2 th:text="${isEdit} ? 'Edit address' : 'Add New Address'">Add New Address</h2>
        <form th:action="${isEdit} ? @{/addresses/edit/{id}(id=${addressId})} : @{/addresses/create}"
              th:object="${addressForm}" method="post" class="form-card">
            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" required/>
                <span class="error" th:errors="*{title}" th:if="${#fields.hasErrors('title')}"></span>
            </div>
            <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" th:field="*{city}" required/>
                <span class="error" th:errors="*{city}" th:if="${#fields.hasErrors('city')}"></span>
            </div>
            <div class="field">
                <label for="district">District</label>
                <input type="text" id="district" th:field="*{district}" required/>
                <span class="error" th:errors="*{district}" th:if="${#fields.hasErrors('district')}"></span>
            </div>
            <div class="field">
                <label for="addressLine">Address Line</label>
                <input type="text" id="addressLine" th:field="*{addressLine}" required/>
                <span class="error" th:errors="*{addressLine}" th:if="${#fields.hasErrors('addressLine')}"></span>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}" required/>
                <span class="error" th:errors="*{phone}" th:if="${#fields.hasErrors('phone')}"></span>
            </div>
            <div class="field">
                <label>
                    <input type="checkbox" th:field="*{defaultAddress}"/> Set as default address
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block"
                    th:text="${isEdit} ? 'Save address' : 'Add Address'">Add Address</button>
        </form>
    </div>

    <hr/>

    <a th:href="@{/checkout}" class="btn btn-link">Back to checkout</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
